214" font-size="108" fill="#f3f2e9" font-weight="750">Make fast</text><text x="64" y="328" font-size="108" fill="#c4fa75" font-weight="750">feel instant.</text><text x="70" y="394" font-size="24" fill="#aab9ae" font-weight="500">A performance toolkit for the agents building your app.</text><text x="70" y="434" font-size="23" fill="#aab9ae" font-weight="500">Framework-independent. Evidence-driven. Ready to act.</text><rect x="70" y="482" width="318" height="48" rx="24" fill="#243428" stroke="#45613d"/><text x="94" y="514" font-size="18" fill="#f3f2e9" font-weight="750" letter-spacing="1">CODEX  +  CLAUDE CODE</text><rect x="937" y="157" width="399" height="329" rx="18" fill="#19221d" stroke="#33443a"/><text x="963" y="196" font-size="13" fill="#aab9ae" font-weight="700" letter-spacing="1">START EARLY. REVEAL PROGRESSIVELY.</text><rect x="964" y="222" width="92" height="34" rx="8" fill="#344736" stroke="#344736"/><text x="980" y="245" font-size="14" fill="#f3f2e9" font-weight="700">SCOPE</text><path d="M1056 239H1080V291H1100M1080 239V376H1100" fill="none" stroke="#c4fa75" stroke-width="2"/><rect x="1100" y="272" width="204" height="38" rx="8" fill="#c4fa75" stroke="#c4fa75"/><text x="1118" y="297" font-size="13" fill="#111714" font-weight="800">PRIMARY CONTENT</text><rect x="1100" y="357" width="204" height="38" rx="8" fill="#344736" stroke="#49644d"/><text x="1118" y="382" font-size="13" fill="#f3f2e9" font-weight="700">OPTIONAL SECTION</text><text x="964" y="446" font-size="12" fill="#aab9ae" font-weight="600" letter-spacing="0.6">ILLUSTRATIVE FLOW · NO TIMING SCALE</text><path d="M70 588H1336" stroke="#33443a" stroke-width="2"/><text x="70" y="657" font-size="54" fill="#f3f2e9" font-weight="750">9</text><text x="70" y="701" font-size="14" fill="#aab9ae" font-weight="700" letter-spacing="1">FOCUSED SKILLS</text><text x="402" y="657" font-size="54" fill="#f3f2e9" font-weight="750">2</text><text x="402" y="701" font-size="14" fill="#aab9ae" font-weight="700" letter-s