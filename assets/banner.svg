<title id="title">Performance Engineering — make fast feel instant</title><desc id="desc">Nine focused skills for Codex and Claude Code. Three advisory hooks and zero runtime package dependencies. A request-flow illustration shows primary and optional work branching after scope is established; it is not a benchmark.</desc>
