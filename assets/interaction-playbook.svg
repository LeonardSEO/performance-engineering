<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="904" viewBox="0 0 1400 904" role="img" aria-labelledby="title desc">
<title id="title">Five rules for responsive interactions</title><desc id="desc">Acknowledge every tap. Show safe changes immediately while saving in the background. Start slow read work early. Reveal a stable page skeleton and ready sections. Show real progress or honest indeterminate status. These are behavior illustrations, not measured speed gains.</desc>
<g font-family="Avenir Next, Segoe UI, sans-serif"><rect x="0" y="0" width="1400" height="904" rx="0" fill="#111714" stroke="#111714"/><text x="56" y="62" font-size="16" fill="#c4fa75" font-weight="750" letter-spacing="2">THE DOHERTY PLAYBOOK</text><text x="56" y="118" font-size="44" fill="#f3f2e9" font-weight="750">Every interaction deserves an answer.</text><rect x="56" y="160" width="1288" height="112" rx="18" fill="#19221d" stroke="#33443a"/><text x="80" y="204" font-size="23" fill="#c4fa75" font-weight="750">01</text><text x="148" y="202" font-size="27" fill="#f3f2e9" font-weight="750">Acknowledge every tap.</text><text x="148" y="239" font-size="20" fill="#aab9ae" font-weight="500">Give the triggering control immediate, visible feedback.</text><rect x="1100" y="189" width="180" height="54" rx="12" fill="#c4fa75" stroke="#c4fa75"/><text x="1149" y="224" font-size="19" fill="#111714" font-weight="800">GOT IT</text><rect x="56" y="289" width="1288" height="112" rx="18" fill="#19221d" stroke="#33443a"/><text x="80" y="333" font-size="23" fill="#c4fa75" font-weight="750">02</text><text x="148" y="331" font-size="27" fill="#f3f2e9" font-weight="750">Show safe changes immediately.</text><text x="148" y="368" font-size="20" fill="#aab9ae" font-weight="500">Save in the background. Reconcile errors and newer intent.</text><rect x="1100" y="319" width="80" height="50" rx="12" fill="#c4fa75" stroke="#c4fa75"/><text x="1123" y="353" font-size="27" fill="#111714" font-weight="750">✓</text><text x="1196" y="348" font-size="13" fill="#aab9ae" font-weight="750" letter-spacing="1">SAVING</text><rect x="56" y="418" width="1288" height="112" rx="18" fill="#19221d" stroke="#33443a"/><text x="80" y="462" font-size="23" fill="#c4fa75" font-weight="750">03</text><text x="148" y="460" font-size="27" fill="#f3f2e9" font-weight="750">Start slow work early.</text><text x="148" y="497" font-size="20" fill="#aab9ae" font-weight="500">Prefetch useful reads when intent makes them likely.</text><rect x="1100" y="445" width="65" height="17" rx="5" fill="#c4fa75" stroke="#c4fa75"/><rect x="1181" y="445" width="94" height="17" rx="5" fill="#344736" stroke="#344736"/><rect x="1100" y="476" width="133" height="17" rx="5" fill="#c4fa75" stroke="#c4fa75"/><rect x="56" y="547" width="1288" height="112" rx="18" fill="#19221d" stroke="#33443a"/><text x="80" y="591" font-size="23" fill="#c4fa75" font-weight="750">04</text><text x="148" y="589" font-size="27" fill="#f3f2e9" font-weight="750">Reveal the shape of the page.</text><text x="148" y="626" font-size="20" fill="#aab9ae" font-weight="500">Use stable skeletons and let ready sections appear.</text><rect x="1100" y="571" width="174" height="17" rx="5" fill="#344736" stroke="#344736"/><rect x="1100" y="598" width="77" height="34" rx="5" fill="#344736" stroke="#344736"/><rect x="1189" y="598" width="85" height="14" rx="5" fill="#344736" stroke="#344736"/><rect x="1189" y="620" width="62" height="12" rx="5" fill="#344736" stroke="#344736"/><rect x="56" y="676" width="1288" height="112" rx="18" fill="#19221d" stroke="#33443a"/><text x="80" y="720" font-size="23" fill="#c4fa75" font-weight="750">05</text><text x="148" y="718" font-size="27" fill="#f3f2e9" font-weight="750">Make progress truthful.</text><text x="148" y="755" font-size="20" fill="#aab9ae" font-weight="500">Use real units, or a labelled indeterminate state.</text><text x="1100" y="715" font-size="13" fill="#aab9ae" font-weight="750" letter-spacing="1">3 / 5 COMPLETED</text><rect x="1100" y="729" width="180" height="16" rx="8" fill="#344736" stroke="#344736"/><rect x="1100" y="729" width="108" height="16" rx="8" fill="#c4fa75" stroke="#c4fa75"/><text x="56" y="864" font-size="19" fill="#aab9ae" font-weight="500">Preserve correctness, accessibility, recoverable input and reduced motion throughout.</text></g></svg>
