<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="970" viewBox="0 0 1400 970" role="img" aria-labelledby="title desc">
<title id="title">Nine skills, with one owner for each performance concern</title><desc id="desc">The performance-engineering router shares a measurement contract across six framework-independent domains: data, backend, progressive rendering, assets, Doherty feedback, and rendering. Separate React/Next.js and React Native skills apply the core to each platform.</desc>
<g font-family="Avenir Next, Segoe UI, sans-serif"><rect x="0" y="0" width="1400" height="970" rx="0" fill="#111714" stroke="#111714"/><text x="56" y="65" font-size="16" fill="#c4fa75" font-weight="750" letter-spacing="2">ONE WORKFLOW. NINE SPECIALISTS.</text><text x="56" y="120" font-size="46" fill="#f3f2e9" font-weight="750">Find the wait. Choose the right skill.</text><rect x="56" y="158" width="1288" height="91" rx="18" fill="#243428" stroke="#49613c"/><text x="82" y="193" font-size="28" fill="#c4fa75" font-weight="750">performance-engineering</text><text x="82" y="226" font-size="20" fill="#f3f2e9" font-weight="500">Route the problem → establish a baseline → verify equivalent results</text><text x="56" y="294" font-size="16" fill="#aab9ae" font-weight="700" letter-spacing="1.5">FRAMEWORK-INDEPENDENT CORE</text><rect x="56" y="320" width="408" height="152" rx="18" fill="#19221d" stroke="#33443a"/><text x="78" y="348" font-size="14" fill="#c4fa75" font-weight="750" letter-spacing="1">01</text><text x="78" y="385" font-size="24" fill="#f3f2e9" font-weight="750">Data performance</text><text x="78" y="421" font-size="16" fill="#aab9ae" font-weight="500">Requests, concurrency and client caches</text><text x="78" y="447" font-size="16" fill="#aab9ae" font-weight="500">Keep scope and newer intent intact.</text><rect x="496" y="320" width="408" height="152" rx="18" fill="#19221d" stroke="#33443a"/><text x="518" y="348" font-size="14" fill="#c4fa75" font-weight="750" letter-spacing="1">02</text><text x="518" y="385" font-size="24" fill="#f3f2e9" font-weight="750">Backend performance</text><text x="518" y="421" font-size="16" fill="#aab9ae" font-weight="500">Queries, API latency and server resources</text><text x="518" y="447" font-size="16" fill="#aab9ae" font-weight="500">Trace the bottleneck. Preserve isolation.</text><rect x="936" y="320" width="408" height="152" rx="18" fill="#19221d" stroke="#33443a"/><text x="958" y="348" font-size="14" fill="#c4fa75" font-weight="750" letter-spacing="1">03</text><text x="958" y="385" font-size="24" fill="#f3f2e9" font-weight="750">Progressive rendering</text><text x="958" y="421" font-size="16" fill="#aab9ae" font-weight="500">A useful shell and independently ready regions</text><text x="958" y="447" font-size="16" fill="#aab9ae" font-weight="500">Reveal content as it becomes usable.</text><rect x="56" y="496" width="408" height="152" rx="18" fill="#19221d" stroke="#33443a"/><text x="78" y="524" font-size="14" fill="#c4fa75" font-weight="750" letter-spacing="1">04</text><text x="78" y="561" font-size="24" fill="#f3f2e9" font-weight="750">Asset performance</text><text x="78" y="597" font-size="16" fill="#aab9ae" font-weight="500">Images, fonts, CSS, JavaScript and delivery</text><text x="78" y="623" font-size="16" fill="#aab9ae" font-weight="500">Follow the measured critical path.</text><rect x="496" y="496" width="408" height="152" rx="18" fill="#19221d" stroke="#33443a"/><text x="518" y="524" font-size="14" fill="#c4fa75" font-weight="750" letter-spacing="1">05</text><text x="518" y="561" font-size="24" fill="#f3f2e9" font-weight="750">Doherty Threshold</text><text x="518" y="597" font-size="16" fill="#aab9ae" font-weight="500">Immediate feedback and optimistic recovery</text><text x="518" y="623" font-size="16" fill="#aab9ae" font-weight="500">Make waiting honest and understandable.</text><rect x="936" y="496" width="408" height="152" rx="18" fill="#19221d" stroke="#33443a"/><text x="958" y="524" font-size="14" fill="#c4fa75" font-weight="750" letter-spacing="1">06</text><text x="958" y="561" font-size="24" fill="#f3f2e9" font-weight="750">Rendering performance</text><text x="958" y="597" font-size="16" fill="#aab9ae" font-weight="500">Main-thread work, layout, paint and motion</text><text x="958" y="623" font-size="16" fill="#aab9ae" font-weight="500">Profile the work behind the frame.</text><text x="56" y="707" font-size="16" fill="#aab9ae" font-weight="700" letter-spacing="1.5">FRAMEWORK-SPECIFIC APPLICATION</text><rect x="56" y="733" width="628" height="144" rx="18" fill="#19221d" stroke="#33443a"/><text x="80" y="762" font-size="14" fill="#c4fa75" font-weight="750" letter-spacing="1">07</text><text x="80" y="799" font-size="26" fill="#f3f2e9" font-weight="750">React / Next.js</text><text x="80" y="830" font-size="18" fill="#aab9ae" font-weight="500">Streaming, hydration and request-local work</text><text x="80" y="855" font-size="18" fill="#aab9ae" font-weight="500">Respect the installed framework version.</text><rect x="716" y="733" width="628" height="144" rx="18" fill="#19221d" stroke="#33443a"/><text x="740" y="762" font-size="14" fill="#c4fa75" font-weight="750" letter-spacing="1">08</text><text x="740" y="799" font-size="26" fill="#f3f2e9" font-weight="750">React Native</text><text x="740" y="830" font-size="18" fill="#aab9ae" font-weight="500">Startup, JS/UI frames, lists and memory</text><text x="740" y="855" font-size="18" fill="#aab9ae" font-weight="500">Use release builds and physical-device evidence.</text><text x="56" y="930" font-size="19" fill="#aab9ae" font-weight="500">Read the guidance the task needs. Load deeper references when diagnosis calls for them.</text></g></svg>
