name: Optional browser performance labs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run labs:assets
      - run: npm run bench:labs -- --assert-budgets --output validation/private/ci-labs.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-results
          path: validation/private/ci-labs.json
